name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm run install:all

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Export -> wipe -> restore round trip through the real tar, on throwaway
      # temp paths. An export you cannot restore is not a backup.
      - name: Backup and restore drill
        run: npm run backup:drill

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke
